<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

#app{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:8px;
}

/* =========================
   VIDEO PREVIEW
========================= */

.preview{
    position:relative;
    width:100%;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    user-select:none;
}

#video{
    display:none;
}

#canvas{
    display:block;
    width:100%;
    height:auto;
    background:#000;
}

/* Overlay for draggable controls */
.overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
}

/* =========================
   EDIT BOX
========================= */

.box{
    position:absolute;
    border:2px solid #00e5ff;
    background:rgba(0,229,255,.12);
    pointer-events:auto;
    touch-action:none;
    display:none;
    min-width:30px;
    min-height:20px;
}

.mask-box{
    border-color:#ffcc00;
    background:rgba(255,204,0,.12);
}

.subtitle-box{
    border-color:#00ff88;
    background:rgba(0,255,136,.08);
    color:#fff;
    font-size:18px;
    font-weight:bold;
    text-align:center;
    padding:5px;
    white-space:nowrap;
    overflow:hidden;
    text-shadow:
        1px 1px 2px #000,
        -1px -1px 2px #000;
}

/* resize handles */

.handle{
    position:absolute;
    width:16px;
    height:16px;
    background:#fff;
    border:2px solid #111;
    border-radius:50%;
    z-index:10;
}

.tl{
    left:-8px;
    top:-8px;
    cursor:nwse-resize;
}

.tr{
    right:-8px;
    top:-8px;
    cursor:nesw-resize;
}

.bl{
    left:-8px;
    bottom:-8px;
    cursor:nesw-resize;
}

.br{
    right:-8px;
    bottom:-8px;
    cursor:nwse-resize;
}

/* =========================
   TIMELINE
========================= */

.timeline{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
}

.timeline button{
    width:42px;
    height:38px;
    border:0;
    border-radius:8px;
    background:#292929;
    color:#fff;
    font-size:18px;
}

.timeline input{
    flex:1;
    min-width:0;
}

#timeText{
    width:48px;
    text-align:right;
    font-size:12px;
    color:#aaa;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:8px 3px;
    background:#1c1c1c;
    border-radius:10px;
    scrollbar-width:none;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    flex:0 0 auto;
    min-width:72px;
    height:55px;
    border:0;
    border-radius:9px;
    background:#292929;
    color:#fff;
    font-size:12px;
    cursor:pointer;
}

.tool:active{
    transform:scale(.97);
}

.tool.active{
    background:#00a8ff;
}

/* =========================
   PANEL
========================= */

.panel{
    margin-top:8px;
    padding:12px;
    background:#1b1b1b;
    border-radius:10px;
}

.panel b{
    font-size:15px;
}

.row{
    display:flex;
    gap:10px;
    align-items:center;
    margin:10px 0;
}

.row label{
    min-width:85px;
    font-size:13px;
}

.row input[type=range]{
    flex:1;
}

select,
input[type=text]{
    width:100%;
    background:#292929;
    color:#fff;
    border:1px solid #555;
    border-radius:6px;
    padding:9px;
}

input[type=range]{
    width:100%;
}

button.action{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#00a86b;
    color:#fff;
    font-weight:bold;
}

.small{
    font-size:12px;
    line-height:1.5;
    color:#aaa;
}

.value{
    width:45px;
    text-align:right;
    font-size:12px;
    color:#aaa;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #app{
        padding:5px;
    }

    .tool{
        min-width:65px;
        height:52px;
        font-size:11px;
    }

    .panel{
        padding:10px;
    }

    .row label{
        min-width:75px;
    }

}
</style>
</head>

<body>

<div id="app">

    <!-- =========================
         VIDEO
    ========================== -->

    <div class="preview" id="preview">

        <video
            id="video"
            playsinline
            preload="metadata">
        </video>

        <canvas id="canvas"></canvas>

        <div class="overlay">

            <div
                id="maskBox"
                class="box mask-box">

                <div class="handle tl"></div>
                <div class="handle tr"></div>
                <div class="handle bl"></div>
                <div class="handle br"></div>

            </div>

            <div
                id="subtitleBox"
                class="box subtitle-box">

                <span id="subtitleTextView">
                    မြန်မာစာတန်း
                </span>

            </div>

        </div>

    </div>

    <!-- =========================
         TIMELINE
    ========================== -->

    <div class="timeline">

        <button id="play">
            ▶️
        </button>

        <input
            id="time"
            type="range"
            min="0"
            max="1"
            value="0"
            step="0.01">

        <span id="timeText">
            0:00
        </span>

    </div>

    <!-- =========================
         CAPCUT STYLE TOOLBAR
    ========================== -->

    <div class="toolbar">

        <button
            class="tool active"
            data-tool="video">
            🎬<br>Video
        </button>

        <button
            class="tool"
            data-tool="mask">
            🔲<br>Mask
        </button>

        <button
            class="tool"
            data-tool="text">
            📝<br>Text
        </button>

        <button
            class="tool"
            data-tool="audio">
            🔊<br>Audio
        </button>

        <button
            class="tool"
            data-tool="music">
            🎵<br>Music
        </button>

        <button
            class="tool"
            data-tool="crop">
            ✂️<br>Ratio
        </button>

        <button
            class="tool"
            data-tool="flip">
            🔄<br>Flip
        </button>

    </div>

    <!-- =========================
         TOOL PANEL
    ========================== -->

    <div id="panel" class="panel"></div>

</div>


<script>

/* =========================================================
   STREAMLIT COMPONENT BRIDGE
   No external CDN required
========================================================= */

(function(){

    function post(type,data){

        const message = Object.assign(
            {
                isStreamlitMessage:true,
                type:type
            },
            data || {}
        );

        window.parent.postMessage(
            message,
            "*"
        );
    }

    window.Streamlit = {

        setComponentReady:function(){

            post(
                "streamlit:componentReady",
                {
                    apiVersion:1
                }
            );

        },

        setFrameHeight:function(height){

            post(
                "streamlit:setFrameHeight",
                {
                    height:Number(height) || 650
                }
            );

        },

        setComponentValue:function(value){

            post(
                "streamlit:setComponentValue",
                {
                    value:value
                }
            );

        },

        RENDER_EVENT:"streamlit:render"

    };

})();


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const preview =
    document.getElementById("preview");

const maskBox =
    document.getElementById("maskBox");

const subtitleBox =
    document.getElementById("subtitleBox");

const subtitleTextView =
    document.getElementById(
        "subtitleTextView"
    );

const timeSlider =
    document.getElementById("time");

const timeText =
    document.getElementById("timeText");

const playButton =
    document.getElementById("play");

const panel =
    document.getElementById("panel");


/* =========================================================
   EDIT STATE
========================================================= */

let state = {

    ratio:"Original",

    zoom:1,

    posX:0,

    posY:0,

    flipH:false,

    flipV:false,

    mask:{

        enabled:false,

        type:"blur",

        invert:false,

        x:.05,

        y:.75,

        w:.90,

        h:.18

    },

    subtitle:{

        enabled:false,

        x:.5,

        y:.85,

        w:.85,

        h:.12,

        size:24

    },

    trimStart:0,

    trimEnd:0,

    originalVolume:0,

    voiceVolume:100,

    musicVolume:15

};


/* =========================================================
   VARIABLES
========================================================= */

let sourceUrl = "";

let subtitleText = "";

let lastSend = 0;


/* =========================================================
   SEND STATE TO PYTHON
========================================================= */

function send(){

    const now = Date.now();

    if(now - lastSend < 30){
        return;
    }

    lastSend = now;

    if(
        window.Streamlit &&
        typeof Streamlit.setComponentValue ===
        "function"
    ){

        Streamlit.setComponentValue({

            ...state,

            currentTime:
                Number(video.currentTime || 0)

        });

    }

}


/* =========================================================
   TIME FORMAT
========================================================= */

function fmt(t){

    t = Math.max(
        0,
        Number(t) || 0
    );

    const m =
        Math.floor(t / 60);

    const s =
        Math.floor(t % 60);

    return (
        m +
        ":" +
        (s < 10 ? "0" : "") +
        s
    );

}


/* =========================================================
   CANVAS SIZE
========================================================= */

function resizeCanvas(){

    const vw =
        video.videoWidth || 640;

    const vh =
        video.videoHeight || 360;

    let w = vw;

    let h = vh;


    if(state.ratio === "9:16"){

        h =
            w * 16 / 9;

    }


    else if(state.ratio === "16:9"){

        h =
            w * 9 / 16;

    }


    else if(state.ratio === "1:1"){

        h = w;

    }


    else if(state.ratio === "4:5"){

        h =
            w * 5 / 4;

    }


    canvas.width =
        Math.max(
            2,
            Math.round(w)
        );

    canvas.height =
        Math.max(
            2,
            Math.round(h)
        );

    draw();

}


/* =========================================================
   DRAW VIDEO
========================================================= */

function draw(){

    if(
        !video.videoWidth ||
        !video.videoHeight
    ){
        return;
    }

    const w =
        canvas.width;

    const h =
        canvas.height;

    ctx.clearRect(
        0,
        0,
        w,
        h
    );

    /*
       Background
    */

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /*
       Calculate video transform
    */

    const scale =
        Number(state.zoom) || 1;

    const x =
        w / 2 +
        (Number(state.posX) / 100) * w;

    const y =
        h / 2 +
        (Number(state.posY) / 100) * h;


    /*
       Original video size
    */

    let vw =
        video.videoWidth *
        scale;

    let vh =
        video.videoHeight *
        scale;


    /*
       Cover canvas when ratio changes
    */

    if(state.ratio !== "Original"){

        const coverScale =
            Math.max(
                w / vw,
                h / vh
            );

        vw *= coverScale;

        vh *= coverScale;

    }


    ctx.save();

    ctx.translate(
        x,
        y
    );


    if(state.flipH){

        ctx.scale(
            -1,
            1
        );

    }


    if(state.flipV){

        ctx.scale(
            1,
            -1
        );

    }


    ctx.drawImage(
        video,
        -vw / 2,
        -vh / 2,
        vw,
        vh
    );

    ctx.restore();


    /*
       Preview mask effect
    */

    drawMaskPreview();


    /*
       Update draggable boxes
    */

    updateBoxes();

}


/* =========================================================
   MASK PREVIEW
========================================================= */

function drawMaskPreview(){

    if(
        !state.mask ||
        !state.mask.enabled
    ){
        return;
    }

    const x =
        Math.round(
            state.mask.x *
            canvas.width
        );

    const y =
        Math.round(
            state.mask.y *
            canvas.height
        );

    const w =
        Math.round(
            state.mask.w *
            canvas.width
        );

    const h =
        Math.round(
            state.mask.h *
            canvas.height
        );


    if(
        w <= 0 ||
        h <= 0
    ){
        return;
    }


    /*
       SOLID
    */

    if(
        state.mask.type ===
        "solid"
    ){

        if(!state.mask.invert){

            ctx.fillStyle =
                "rgba(0,0,0,.90)";

            ctx.fillRect(
                x,
                y,
                w,
                h
            );

        }
        else{

            ctx.save();

            ctx.fillStyle =
                "rgba(0,0,0,.65)";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.globalCompositeOperation =
                "destination-out";

            ctx.fillRect(
                x,
                y,
                w,
                h
            );

            ctx.restore();

        }

        return;

    }


    /*
       BLUR
    */

    if(
        state.mask.type ===
        "blur"
    ){

        /*
           Canvas preview uses a light visual
           approximation. Final rendering is
           performed by Python/FFmpeg.
        */

        ctx.save();

        ctx.fillStyle =
            "rgba(180,180,180,.30)";

        ctx.fillRect(
            x,
            y,
            w,
            h
        );

        ctx.strokeStyle =
            "rgba(255,255,255,.25)";

        ctx.strokeRect(
            x,
            y,
            w,
            h
        );

        ctx.restore();

        return;

    }


    /*
       MOSAIC
    */

    if(
        state.mask.type ===
        "mosaic"
    ){

        ctx.save();

        ctx.fillStyle =
            "rgba(120,120,120,.40)";

        ctx.fillRect(
            x,
            y,
            w,
            h
        );


        const block = 12;

        ctx.fillStyle =
            "rgba(255,255,255,.12)";


        for(
            let yy=y;
            yy<y+h;
            yy+=block
        ){

            for(
                let xx=x;
                xx<x+w;
                xx+=block
            ){

                ctx.fillRect(
                    xx,
                    yy,
                    block/2,
                    block/2
                );

            }

        }

        ctx.restore();

    }

}


/* =========================================================
   UPDATE OVERLAY BOXES
========================================================= */

function updateBoxes(){

    const rect =
        canvas.getBoundingClientRect();

    if(
        !rect.width ||
        !rect.height
    ){
        return;
    }


    /*
       MASK
    */

    if(
        state.mask &&
        state.mask.enabled
    ){

        maskBox.style.display =
            "block";

        maskBox.style.left =
            (
                state.mask.x *
                rect.width
            ) + "px";

        maskBox.style.top =
            (
                state.mask.y *
                rect.height
            ) + "px";

        maskBox.style.width =
            (
                state.mask.w *
                rect.width
            ) + "px";

        maskBox.style.height =
            (
                state.mask.h *
                rect.height
            ) + "px";

    }
    else{

        maskBox.style.display =
            "none";

    }


    /*
       SUBTITLE
    */

    if(
        state.subtitle &&
        state.subtitle.enabled
    ){

        subtitleBox.style.display =
            "block";

        subtitleBox.style.left =
            (
                (
                    state.subtitle.x -
                    state.subtitle.w / 2
                ) *
                rect.width
            ) + "px";

        subtitleBox.style.top =
            (
                (
                    state.subtitle.y -
                    state.subtitle.h / 2
                ) *
                rect.height
            ) + "px";

        subtitleBox.style.width =
            (
                state.subtitle.w *
                rect.width
            ) + "px";

        subtitleBox.style.height =
            (
                state.subtitle.h *
                rect.height
            ) + "px";

        subtitleTextView.textContent =
            subtitleText ||
            "မြန်မာစာတန်း";

        subtitleBox.style.fontSize =
            Math.max(
                12,
                Number(
                    state.subtitle.size
                ) || 24
            ) + "px";

    }
    else{

        subtitleBox.style.display =
            "none";

    }

}


/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener(
    "loadedmetadata",
    function(){

        state.trimEnd =
            video.duration || 0;

        timeSlider.max =
            video.duration || 1;

        resizeCanvas();

        send();

    }
);


video.addEventListener(
    "timeupdate",
    function(){

        if(!video.seeking){

            timeSlider.value =
                video.currentTime;

        }

        timeText.textContent =
            fmt(video.currentTime);

        draw();

    }
);


video.addEventListener(
    "play",
    function(){

        playButton.textContent =
            "⏸️";

    }
);


video.addEventListener(
    "pause",
    function(){

        playButton.textContent =
            "▶️";

        send();

    }
);


/* =========================================================
   PLAY / PAUSE
========================================================= */

playButton.onclick =
    function(){

        if(video.paused){

            video.play()
                .catch(function(){});

        }
        else{

            video.pause();

        }

    };


/* =========================================================
   TIMELINE
========================================================= */

timeSlider.oninput =
    function(){

        video.currentTime =
            Number(
                timeSlider.value
            );

        timeText.textContent =
            fmt(video.currentTime);

        draw();

        send();

    };


/* =========================================================
   DRAG / RESIZE SYSTEM
========================================================= */

function setupDrag(
    box,
    type
){

    let action = null;

    let startX = 0;

    let startY = 0;

    let original = null;


    box.addEventListener(
        "pointerdown",
        function(e){

            e.preventDefault();

            box.setPointerCapture(
                e.pointerId
            );


            const rect =
                canvas.getBoundingClientRect();

            startX =
                e.clientX;

            startY =
                e.clientY;


            if(type === "mask"){

                original = {
                    ...state.mask
                };

            }
            else{

                original = {
                    ...state.subtitle
                };

            }


            const target =
                e.target;


            if(
                target.classList.contains(
                    "handle"
                )
            ){

                let corner = "";

                if(
                    target.classList.contains(
                        "tl"
                    )
                ){
                    corner = "tl";
                }

                if(
                    target.classList.contains(
                        "tr"
                    )
                ){
                    corner = "tr";
                }

                if(
                    target.classList.contains(
                        "bl"
                    )
                ){
                    corner = "bl";
                }

                if(
                    target.classList.contains(
                        "br"
                    )
                ){
                    corner = "br";
                }

                action = {
                    mode:"resize",
                    corner:corner
                };

            }
            else{

                action = {
                    mode:"move"
                };

            }

        }
    );


    box.addEventListener(
        "pointermove",
        function(e){

            if(!action){
                return;
            }


            const rect =
                canvas.getBoundingClientRect();


            if(
                !rect.width ||
                !rect.height
            ){
                return;
            }


            const dx =
                (
                    e.clientX -
                    startX
                ) /
                rect.width;

            const dy =
                (
                    e.clientY -
                    startY
                ) /
                rect.height;


            const obj =
                type === "mask"
                ? state.mask
                : state.subtitle;


            /*
               MOVE
            */

            if(
                action.mode ===
                "move"
            ){

                if(type === "mask"){

                    obj.x =
                        Math.max(
                            0,
                            Math.min(
                                1 - obj.w,
                                original.x + dx
                            )
                        );

                    obj.y =
                        Math.max(
                            0,
                            Math.min(
                                1 - obj.h,
                                original.y + dy
                            )
                        );

                }
                else{

                    obj.x =
                        Math.max(
                            obj.w / 2,
                            Math.min(
                                1 - obj.w / 2,
                                original.x + dx
                            )
                        );

                    obj.y =
                        Math.max(
                            obj.h / 2,
                            Math.min(
                                1 - obj.h / 2,
                                original.y + dy
                            )
                        );

                }

            }


            /*
               RESIZE
            */

            else{

                const min =
                    0.03;

                let x =
                    original.x;

                let y =
                    original.y;

                let w =
                    original.w;

                let h =
                    original.h;


                /*
                   LEFT
                */

                if(
                    action.corner.includes(
                        "l"
                    )
                ){

                    const right =
                        original.x +
                        original.w;

                    const nx =
                        Math.max(
                            0,
                            Math.min(
                                right - min,
                                original.x + dx
                            )
                        );

                    x = nx;

                    w =
                        right - nx;

                }


                /*
                   RIGHT
                */

                if(
                    action.corner.includes(
                        "r"
                    )
                ){

                    w =
                        Math.max(
                            min,
                            Math.min(
                                1 - x,
                                original.w + dx
                            )
                        );

                }


                /*
                   TOP
                */

                if(
                    action.corner.includes(
                        "t"
                    )
                ){

                    const bottom =
                        original.y +
                        original.h;

                    const ny =
                        Math.max(
                            0,
                            Math.min(
                                bottom - min,
                                original.y + dy
                            )
                        );

                    y = ny;

                    h =
                        bottom - ny;

                }


                /*
                   BOTTOM
                */

                if(
                    action.corner.includes(
                        "b"
                    )
                ){

                    h =
                        Math.max(
                            min,
                            Math.min(
                                1 - y,
                                original.h + dy
                            )
                        );

                }


                obj.x = x;

                obj.y = y;

                obj.w = w;

                obj.h = h;

            }


            updateBoxes();

            draw();

            send();

        }
    );


    box.addEventListener(
        "pointerup",
        function(){

            action = null;

            send();

        }
    );


    box.addEventListener(
        "pointercancel",
        function(){

            action = null;

        }
    );

}


setupDrag(
    maskBox,
    "mask"
);

setupDrag(
    subtitleBox,
    "subtitle"
);


/* =========================================================
   TOOL BUTTONS
========================================================= */

document
    .querySelectorAll(".tool")
    .forEach(
        function(btn){

            btn.onclick =
                function(){

                    document
                        .querySelectorAll(
                            ".tool"
                        )
                        .forEach(
                            function(x){

                                x.classList.remove(
                                    "active"
                                );

                            }
                        );

                    btn.classList.add(
                        "active"
                    );

                    showPanel(
                        btn.dataset.tool
                    );

                };

        }
    );

/* =========================================================
   STREAMLIT → JAVASCRIPT
========================================================= */

function receiveStreamlitRender(
    event
){

    if(!event){
        return;
    }


    const data =
        event.detail || {};


    const args =
        data.args || {};


    /*
       VIDEO
    */

    if(args.video){

        if(
            sourceUrl !==
            args.video
        ){

            sourceUrl =
                args.video;

            video.src =
                sourceUrl;

            video.load();

        }

    }


    /*
       SUBTITLE
    */

    if(
        typeof args.subtitle ===
        "string"
    ){

        subtitleText =
            args.subtitle;

        subtitleTextView.textContent =
            subtitleText ||
            "မြန်မာစာတန်း";

        updateBoxes();

    }


    /*
       STATE
    */

    if(args.state){

        const incoming =
            args.state;


        state = {

            ...state,

            ...incoming,

            mask:{
                ...state.mask,

                ...(incoming.mask || {})

            },

            subtitle:{
                ...state.subtitle,

                ...(incoming.subtitle || {})

            }

        };


        resizeCanvas();

    }

}


/* =========================================================
   STREAMLIT RENDER EVENT
========================================================= */

window.addEventListener(
    "message",
    function(event){

        if(
            event.data &&
            event.data.type ===
            "streamlit:render"
        ){

            receiveStreamlitRender({

                detail:event.data

            });

        }

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        resizeCanvas();

        updateBoxes();

    }
);


/* =========================================================
   INITIALIZE STREAMLIT COMPONENT
========================================================= */

if(
    window.Streamlit &&
    typeof Streamlit.setComponentReady ===
    "function"
){

    Streamlit.setComponentReady();

    Streamlit.setFrameHeight(
        700
    );

}


/* =========================================================
   DEFAULT PANEL
========================================================= */

showPanel(
    "video"
);


/* =========================================================
   INITIAL DRAW
========================================================= */

updateBoxes();


</script>
