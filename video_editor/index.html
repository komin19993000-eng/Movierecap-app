<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

body{
    min-height:100%;
}

#app{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:8px;
}

/* =========================
   VIDEO PREVIEW
========================= */

.preview{
    position:relative;
    width:100%;
    background:#000;
    border-radius:12px;
    overflow:hidden;
    line-height:0;
}

#video{
    display:none;
}

#canvas{
    display:block;
    width:100%;
    height:auto;
    background:#000;
    touch-action:none;
}

/* =========================
   OVERLAY
========================= */

.overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.box{
    position:absolute;
    display:none;
    pointer-events:auto;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
}

.mask-box{
    border:2px solid #ffcc00;
    background:rgba(255,204,0,.15);
    z-index:10;
}

.subtitle-box{
    border:2px solid #00ff88;
    background:rgba(0,255,136,.08);
    color:#fff;
    font-size:24px;
    font-weight:bold;
    text-align:center;
    padding:5px;
    white-space:nowrap;
    overflow:hidden;
    line-height:1.2;
    z-index:11;
    text-shadow:
        1px 1px 2px #000,
        -1px -1px 2px #000,
        1px -1px 2px #000,
        -1px 1px 2px #000;
}

.handle{
    position:absolute;
    width:16px;
    height:16px;
    background:#fff;
    border:2px solid #111;
    border-radius:50%;
    z-index:20;
    touch-action:none;
}

.tl{
    left:-8px;
    top:-8px;
}

.tr{
    right:-8px;
    top:-8px;
}

.bl{
    left:-8px;
    bottom:-8px;
}

.br{
    right:-8px;
    bottom:-8px;
}

/* =========================
   TIMELINE
========================= */

.timeline{
    width:100%;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 0;
}

.play-button{
    flex:0 0 54px;
    width:54px;
    height:48px;
    border:0;
    border-radius:10px;
    background:#292929;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.timeline input[type=range]{
    flex:1;
    min-width:0;
}

.time-text{
    flex:0 0 42px;
    text-align:right;
    color:#ccc;
    font-size:13px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    width:100%;
    display:flex;
    gap:7px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:8px 3px;
    background:#1c1c1c;
    border-radius:12px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    flex:0 0 76px;
    min-width:76px;
    height:64px;
    border:0;
    border-radius:10px;
    background:#292929;
    color:#fff;
    font-size:12px;
    cursor:pointer;
    line-height:1.25;
}

.tool:active{
    transform:scale(.97);
}

.tool.active{
    background:#00a8ff;
}

/* =========================
   PANEL
========================= */

.panel{
    width:100%;
    margin-top:8px;
    padding:12px;
    background:#1b1b1b;
    border-radius:12px;
}

.panel-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:10px 0;
}

.row label{
    flex:0 0 100px;
    font-size:14px;
}

.row input[type=range]{
    flex:1;
    min-width:0;
}

.row select{
    flex:1;
}

.value{
    flex:0 0 45px;
    text-align:right;
    color:#aaa;
    font-size:13px;
}

select,
input[type=text]{
    width:100%;
    background:#292929;
    color:#fff;
    border:1px solid #555;
    border-radius:7px;
    padding:9px;
    font-size:14px;
}

input[type=range]{
    accent-color:#00a8ff;
}

.check-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin:10px 0;
    font-size:14px;
}

.small{
    color:#999;
    font-size:12px;
    line-height:1.5;
}

.action{
    width:100%;
    margin-top:8px;
    padding:11px;
    border:0;
    border-radius:8px;
    background:#00a86b;
    color:#fff;
    font-weight:bold;
}

.info{
    padding:9px;
    margin-top:8px;
    border-radius:8px;
    background:#252525;
    color:#bbb;
    font-size:12px;
    line-height:1.5;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #app{
        padding:6px;
    }

    .tool{
        flex-basis:72px;
        min-width:72px;
        height:62px;
    }

    .row label{
        flex-basis:85px;
    }

    .subtitle-box{
        font-size:18px;
    }

    .handle{
        width:18px;
        height:18px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =========================
         VIDEO
    ========================== -->

    <div class="preview" id="preview">

        <video
            id="video"
            playsinline
            preload="metadata">
        </video>

        <canvas id="canvas"></canvas>

        <div class="overlay">

            <div id="maskBox" class="box mask-box">

                <div class="handle tl"></div>
                <div class="handle tr"></div>
                <div class="handle bl"></div>
                <div class="handle br"></div>

            </div>

            <div id="subtitleBox" class="box subtitle-box">

                <div class="handle tl"></div>
                <div class="handle tr"></div>
                <div class="handle bl"></div>
                <div class="handle br"></div>

            </div>

        </div>

    </div>


    <!-- =========================
         TIMELINE
    ========================== -->

    <div class="timeline">

        <button
            id="play"
            class="play-button"
            type="button">
            ▶️
        </button>

        <input
            id="time"
            type="range"
            min="0"
            max="1"
            value="0"
            step="0.01">

        <span
            id="timeText"
            class="time-text">
            0:00
        </span>

    </div>


    <!-- =========================
         TOOLBAR
    ========================== -->

    <div class="toolbar">

        <button
            class="tool active"
            data-tool="video"
            type="button">
            🎬<br>
            Video
        </button>

        <button
            class="tool"
            data-tool="mask"
            type="button">
            🔲<br>
            Mask
        </button>

        <button
            class="tool"
            data-tool="text"
            type="button">
            📝<br>
            Text
        </button>

        <button
            class="tool"
            data-tool="audio"
            type="button">
            🔊<br>
            Audio
        </button>

        <button
            class="tool"
            data-tool="music"
            type="button">
            🎵<br>
            Music
        </button>

        <button
            class="tool"
            data-tool="crop"
            type="button">
            ✂️<br>
            Crop
        </button>

        <button
            class="tool"
            data-tool="flip"
            type="button">
            🔄<br>
            Flip
        </button>

    </div>


    <!-- =========================
         CONTROL PANEL
    ========================== -->

    <div
        id="panel"
        class="panel">
    </div>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const preview =
    document.getElementById("preview");

const maskBox =
    document.getElementById("maskBox");

const subtitleBox =
    document.getElementById("subtitleBox");

const timeSlider =
    document.getElementById("time");

const timeText =
    document.getElementById("timeText");

const playButton =
    document.getElementById("play");

const panel =
    document.getElementById("panel");


/* =========================================================
   STATE
========================================================= */

let state = {

    ratio:"Original",

    zoom:1,

    posX:0,

    posY:0,

    flipH:false,

    flipV:false,

    mask:{

        enabled:false,

        type:"blur",

        invert:false,

        x:.05,

        y:.75,

        w:.90,

        h:.18

    },

    subtitle:{

        enabled:false,

        x:.5,

        y:.85,

        w:.85,

        h:.12,

        size:24

    },

    trimStart:0,

    trimEnd:0,

    originalVolume:0,

    voiceVolume:100,

    musicVolume:15

};


let sourceUrl = "";

let subtitleText = "";


/*
 IMPORTANT:

 We do NOT send state to Streamlit
 while the user is dragging/sliding.

 This prevents Streamlit reruns.
*/

let sendTimer = null;

function sendToStreamlit(){

    if(!window.Streamlit){
        return;
    }

    clearTimeout(sendTimer);

    sendTimer = setTimeout(()=>{

        Streamlit.setComponentValue({

            ...state,

            currentTime:
                Number(video.currentTime || 0)

        });

    },80);

}


/* =========================================================
   FRAME HEIGHT
========================================================= */

let heightTimer = null;

function updateFrameHeight(){

    if(!window.Streamlit){
        return;
    }

    clearTimeout(heightTimer);

    heightTimer = setTimeout(()=>{

        const height = Math.max(

            document.body.scrollHeight,

            document.documentElement.scrollHeight,

            preview.scrollHeight

        ) + 25;

        Streamlit.setFrameHeight(height);

    },50);

}


/* =========================================================
   FORMAT TIME
========================================================= */

function fmt(t){

    t = Math.max(
        0,
        Number(t || 0)
    );

    const m =
        Math.floor(t / 60);

    const s =
        Math.floor(t % 60);

    return (
        m +
        ":" +
        (s < 10 ? "0" : "") +
        s
    );

}


/* =========================================================
   CANVAS SIZE
========================================================= */

function resizeCanvas(){

    if(!video.videoWidth){
        return;
    }

    const sourceW =
        video.videoWidth;

    const sourceH =
        video.videoHeight;

    let w = sourceW;

    let h = sourceH;


    /*
       Keep original dimensions.
    */

    if(state.ratio === "Original"){

        w = sourceW;

        h = sourceH;

    }


    /*
       9:16
    */

    else if(state.ratio === "9:16"){

        w = sourceW;

        h = w * 16 / 9;

    }


    /*
       16:9
    */

    else if(state.ratio === "16:9"){

        w = sourceW;

        h = w * 9 / 16;

    }


    /*
       1:1
    */

    else if(state.ratio === "1:1"){

        w = sourceW;

        h = w;

    }


    /*
       4:5
    */

    else if(state.ratio === "4:5"){

        w = sourceW;

        h = w * 5 / 4;

    }


    canvas.width =
        Math.round(w);

    canvas.height =
        Math.round(h);


    draw();

    updateBoxes();

    updateFrameHeight();

}


/* =========================================================
   DRAW VIDEO
========================================================= */

function draw(){

    if(
        !video.videoWidth ||
        !video.videoHeight ||
        !canvas.width ||
        !canvas.height
    ){

        return;

    }

    const w =
        canvas.width;

    const h =
        canvas.height;


    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    /*
       Black canvas background.
    */

    ctx.fillStyle = "#000";

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /*
       Video transform.
    */

    ctx.save();


    const scale =
        Number(state.zoom || 1);


    const x =
        w / 2 +
        (Number(state.posX || 0) / 100) * w;


    const y =
        h / 2 +
        (Number(state.posY || 0) / 100) * h;


    ctx.translate(
        x,
        y
    );


    if(state.flipH){

        ctx.scale(
            -1,
            1
        );

    }


    if(state.flipV){

        ctx.scale(
            1,
            -1
        );

    }


    const vw =
        video.videoWidth *
        scale;


    const vh =
        video.videoHeight *
        scale;


    ctx.drawImage(

        video,

        -vw / 2,

        -vh / 2,

        vw,

        vh

    );


    ctx.restore();


    updateBoxes();

}


/* =========================================================
   OVERLAY BOXES
========================================================= */

function updateBoxes(){

    const rect =
        canvas.getBoundingClientRect();


    if(state.mask.enabled){

        maskBox.style.display =
            "block";

        maskBox.style.left =
            (
                state.mask.x *
                rect.width
            ) + "px";

        maskBox.style.top =
            (
                state.mask.y *
                rect.height
            ) + "px";

        maskBox.style.width =
            (
                state.mask.w *
                rect.width
            ) + "px";

        maskBox.style.height =
            (
                state.mask.h *
                rect.height
            ) + "px";

    }

    else{

        maskBox.style.display =
            "none";

    }


    if(state.subtitle.enabled){

        subtitleBox.style.display =
            "block";


        subtitleBox.style.left =
            (
                (
                    state.subtitle.x -
                    state.subtitle.w / 2
                ) *
                rect.width
            ) + "px";


        subtitleBox.style.top =
            (
                (
                    state.subtitle.y -
                    state.subtitle.h / 2
                ) *
                rect.height
            ) + "px";


        subtitleBox.style.width =
            (
                state.subtitle.w *
                rect.width
            ) + "px";


        subtitleBox.style.height =
            (
                state.subtitle.h *
                rect.height
            ) + "px";


        subtitleBox.innerText =
            subtitleText ||
            "မြန်မာစာတန်း";


        subtitleBox.style.fontSize =
            Math.max(
                12,
                Number(state.subtitle.size)
            ) + "px";

    }

    else{

        subtitleBox.style.display =
            "none";

    }

}


/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener(
    "loadedmetadata",
    ()=>{

        state.trimEnd =
            Number(video.duration || 0);

        timeSlider.max =
            Number(video.duration || 1);

        resizeCanvas();

        updateFrameHeight();

        sendToStreamlit();

    }
);


video.addEventListener(
    "timeupdate",
    ()=>{

        if(!video.seeking){

            timeSlider.value =
                video.currentTime;

        }

        timeText.innerText =
            fmt(video.currentTime);

        draw();

    }
);


video.addEventListener(
    "play",
    ()=>{

        playButton.innerText =
            "⏸️";

    }
);


video.addEventListener(
    "pause",
    ()=>{

        playButton.innerText =
            "▶️";

    }
);


/* =========================================================
   PLAY BUTTON
========================================================= */

playButton.addEventListener(
    "click",
    ()=>{

        if(video.paused){

            video.play();

        }

        else{

            video.pause();

        }

    }
);


/* =========================================================
   TIMELINE
========================================================= */

timeSlider.addEventListener(
    "input",
    ()=>{

        video.currentTime =
            Number(timeSlider.value);

        timeText.innerText =
            fmt(video.currentTime);

        draw();

        /*
           NO Streamlit rerun here.
        */

    }
);


timeSlider.addEventListener(
    "change",
    ()=>{

        sendToStreamlit();

    }
);


/* =========================================================
   DRAG / RESIZE
========================================================= */

function setupDrag(
    box,
    type
){

    let action = null;

    let startX = 0;

    let startY = 0;

    let original = null;


    box.addEventListener(
        "pointerdown",
        e=>{

            e.preventDefault();

            e.stopPropagation();

            try{

                box.setPointerCapture(
                    e.pointerId
                );

            }catch(err){}


            const rect =
                canvas.getBoundingClientRect();


            startX =
                e.clientX;

            startY =
                e.clientY;


            if(type === "mask"){

                original = {
                    ...state.mask
                };

            }

            else{

                original = {
                    ...state.subtitle
                };

            }


            const target =
                e.target;


            if(
                target.classList.contains(
                    "handle"
                )
            ){

                let corner = "";


                if(
                    target.classList.contains(
                        "tl"
                    )
                ){

                    corner = "tl";

                }


                if(
                    target.classList.contains(
                        "tr"
                    )
                ){

                    corner = "tr";

                }


                if(
                    target.classList.contains(
                        "bl"
                    )
                ){

                    corner = "bl";

                }


                if(
                    target.classList.contains(
                        "br"
                    )
                ){

                    corner = "br";

                }


                action = {

                    mode:"resize",

                    corner:corner

                };

            }

            else{

                action = {

                    mode:"move"

                };

            }

        }
    );


    box.addEventListener(
        "pointermove",
        e=>{

            if(!action){
                return;
            }


            e.preventDefault();


            const rect =
                canvas.getBoundingClientRect();


            if(
                rect.width <= 0 ||
                rect.height <= 0
            ){

                return;

            }


            const dx =
                (
                    e.clientX -
                    startX
                ) /
                rect.width;


            const dy =
                (
                    e.clientY -
                    startY
                ) /
                rect.height;


            const obj =
                type === "mask"
                ? state.mask
                : state.subtitle;


            /* =========================
               MOVE
            ========================== */

            if(
                action.mode === "move"
            ){

                if(type === "mask"){

                    obj.x =
                        Math.max(
                            0,
                            Math.min(
                                1 - obj.w,
                                original.x + dx
                            )
                        );


                    obj.y =
                        Math.max(
                            0,
                            Math.min(
                                1 - obj.h,
                                original.y + dy
                            )
                        );

                }

                else{

                    obj.x =
                        Math.max(
                            obj.w / 2,
                            Math.min(
                                1 - obj.w / 2,
                                original.x + dx
                            )
                        );


                    obj.y =
                        Math.max(
                            obj.h / 2,
                            Math.min(
                                1 - obj.h / 2,
                                original.y + dy
                            )
                        );

                }

            }


            /* =========================
               RESIZE
            ========================== */

            else{

                const min =
                    0.03;


                let x =
                    original.x;

                let y =
                    original.y;

                let w =
                    original.w;

                let h =
                    original.h;


                /*
                   Left
                */

                if(
                    action.corner.includes("l")
                ){

                    const nx =
                        Math.max(
                            0,
                            Math.min(
                                x + w - min,
                                x + dx
                            )
                        );

                    w =
                        w - (
                            nx - x
                        );

                    x =
                        nx;

                }


                /*
                   Right
                */

                if(
                    action.corner.includes("r")
                ){

                    w =
                        Math.max(
                            min,
                            Math.min(
                                1 - x,
                                original.w + dx
                            )
                        );

                }


                /*
                   Top
                */

                if(
                    action.corner.includes("t")
                ){

                    const ny =
                        Math.max(
                            0,
                            Math.min(
                                y + h - min,
                                y + dy
                            )
                        );

                    h =
                        h - (
                            ny - y
                        );

                    y =
                        ny;

                }


                /*
                   Bottom
                */

                if(
                    action.corner.includes("b")
                ){

                    h =
                        Math.max(
                            min,
                            Math.min(
                                1 - y,
                                original.h + dy
                            )
                        );

                }


                obj.x = x;

                obj.y = y;

                obj.w = w;

                obj.h = h;

            }


            updateBoxes();


            /*
               DO NOT send to Streamlit
               while dragging.
            */

        }
    );


    function finishPointer(){

        if(!action){
            return;
        }

        action = null;

        sendToStreamlit();

        updateFrameHeight();

    }


    box.addEventListener(
        "pointerup",
        finishPointer
    );


    box.addEventListener(
        "pointercancel",
        finishPointer
    );


    box.addEventListener(
        "lostpointercapture",
        finishPointer
    );

}


setupDrag(
    maskBox,
    "mask"
);


setupDrag(
    subtitleBox,
    "subtitle"
);


/* =========================================================
   TOOL BUTTONS
========================================================= */

document
.querySelectorAll(".tool")
.forEach(
    btn=>{

        btn.addEventListener(
            "click",
            ()=>{

                document
                .querySelectorAll(".tool")
                .forEach(
                    x=>{
                        x.classList.remove(
                            "active"
                        );
                    }
                );


                btn.classList.add(
                    "active"
                );


                showPanel(
                    btn.dataset.tool
                );


                updateFrameHeight();

            }
        );

    }
);


/* =========================================================
   PANEL
========================================================= */

function showPanel(tool){


    /* =====================================================
       VIDEO
    ===================================================== */

    if(tool === "video"){

        panel.innerHTML = `

            <div class="panel-title">
                🎬 Video
            </div>

            <div class="row">

                <label>
                    Zoom
                </label>

                <input
                    id="zoom"
                    type="range"
                    min="0.5"
                    max="2.5"
                    step="0.01"
                    value="${state.zoom}">

                <span
                    id="zoomValue"
                    class="value">
                    ${Number(state.zoom).toFixed(2)}
                </span>

            </div>


            <div class="row">

                <label>
                    X Position
                </label>

                <input
                    id="px"
                    type="range"
                    min="-50"
                    max="50"
                    step="1"
                    value="${state.posX}">

                <span
                    id="pxValue"
                    class="value">
                    ${state.posX}
                </span>

            </div>


            <div class="row">

                <label>
                    Y Position
                </label>

                <input
                    id="py"
                    type="range"
                    min="-50"
                    max="50"
                    step="1"
                    value="${state.posY}">

                <span
                    id="pyValue"
                    class="value">
                    ${state.posY}
                </span>

            </div>


            <div class="info">
                Zoom / Position ကို ပြင်နေချိန်

/* =========================================================
   RECEIVE DATA FROM PYTHON
========================================================= */

function receive(event){

    const data =
        event.detail || {};


    if(!data.args){
        return;
    }


    const args =
        data.args;


    /*
       VIDEO
    */

    if(args.video){

        if(
            sourceUrl !== args.video
        ){

            sourceUrl =
                args.video;

            video.src =
                sourceUrl;

            video.load();

        }

    }


    /*
       SUBTITLE
    */

    if(
        typeof args.subtitle ===
        "string"
    ){

        subtitleText =
            args.subtitle;

        updateBoxes();

    }


    /*
       STATE
    */

    if(args.state){

        state = {

            ...state,

            ...args.state,

            mask:{

                ...state.mask,

                ...(args.state.mask || {})

            },

            subtitle:{

                ...state.subtitle,

                ...(args.state.subtitle || {})

            }

        };


        if(video.videoWidth){

            resizeCanvas();

        }


        updateBoxes();

    }


    updateFrameHeight();

}


/* =========================================================
   STREAMLIT MESSAGE
========================================================= */

window.addEventListener(
    "message",
    event=>{

        if(
            event.data &&
            event.data.type ===
            "streamlit:render"
        ){

            receive({

                detail:
                    event.data

            });

        }

    }
);


/* =========================================================
   WINDOW RESIZE
========================================================= */

let resizeTimer = null;

window.addEventListener(
    "resize",
    ()=>{

        clearTimeout(
            resizeTimer
        );

        resizeTimer =
            setTimeout(
                ()=>{

                    if(
                        video.videoWidth
                    ){

                        resizeCanvas();

                    }

                    updateBoxes();

                    updateFrameHeight();

                },
                100
            );

    }
);


/* =========================================================
   RESIZE OBSERVER
========================================================= */

if(
    typeof ResizeObserver !==
    "undefined"
){

    const observer =
        new ResizeObserver(
            ()=>{

                updateBoxes();

                updateFrameHeight();

            }
        );


    observer.observe(
        document.body
    );

}


/* =========================================================
   STREAMLIT INIT
========================================================= */

if(window.Streamlit){

    Streamlit.setComponentReady();

    /*
       Initial height.
       It will automatically update
       after 9:16 / panel changes.
    */

    Streamlit.setFrameHeight(
        Math.max(
            650,
            document.body.scrollHeight + 25
        )
    );

}


/* =========================================================
   INITIAL PANEL
========================================================= */

showPanel("video");

setTimeout(
    updateFrameHeight,
    100
);

setTimeout(
    updateFrameHeight,
    500
);

setTimeout(
    updateFrameHeight,
    1000
);

</script>
