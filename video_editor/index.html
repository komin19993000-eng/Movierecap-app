
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

#app{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:8px;
}

.preview{
    position:relative;
    width:100%;
    background:#000;
    border-radius:10px;
    overflow:hidden;
}

#video{
    display:none;
}

#canvas{
    display:block;
    width:100%;
    height:auto;
    background:#000;
}

.overlay{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.box{
    position:absolute;
    border:2px solid #00e5ff;
    background:rgba(0,229,255,.12);
    pointer-events:auto;
    touch-action:none;
    display:none;
}

.mask-box{
    border-color:#ffcc00;
    background:rgba(255,204,0,.15);
}

.subtitle-box{
    border-color:#00ff88;
    background:rgba(0,255,136,.08);
    color:white;
    font-size:18px;
    font-weight:bold;
    text-align:center;
    padding:5px;
    white-space:nowrap;
    overflow:hidden;
}

.handle{
    position:absolute;
    width:14px;
    height:14px;
    background:#fff;
    border:2px solid #111;
    border-radius:50%;
}

.tl{left:-7px;top:-7px}
.tr{right:-7px;top:-7px}
.bl{left:-7px;bottom:-7px}
.br{right:-7px;bottom:-7px}

.timeline{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 0;
}

.timeline input{
    flex:1;
}

.toolbar{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:8px 3px;
    background:#1c1c1c;
    border-radius:10px;
    scrollbar-width:none;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    flex:0 0 auto;
    min-width:72px;
    height:55px;
    border:0;
    border-radius:9px;
    background:#292929;
    color:#fff;
    font-size:12px;
    cursor:pointer;
}

.tool.active{
    background:#00a8ff;
}

.panel{
    margin-top:8px;
    padding:10px;
    background:#1b1b1b;
    border-radius:10px;
}

.row{
    display:flex;
    gap:10px;
    align-items:center;
    margin:8px 0;
}

.row>*{
    min-width:0;
}

label{
    font-size:13px;
}

input[type=range]{
    width:100%;
}

select,input[type=text]{
    background:#292929;
    color:white;
    border:1px solid #555;
    border-radius:6px;
    padding:8px;
}

button.action{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#00a86b;
    color:#fff;
    font-weight:bold;
}

.small{
    font-size:12px;
    color:#aaa;
}
</style>
</head>

<body>

<div id="app">

<div class="preview" id="preview">

    <video id="video" playsinline></video>

    <canvas id="canvas"></canvas>

    <div class="overlay">

        <div id="maskBox" class="box mask-box">
            <div class="handle tl"></div>
            <div class="handle tr"></div>
            <div class="handle bl"></div>
            <div class="handle br"></div>
        </div>

        <div id="subtitleBox" class="box subtitle-box">
            Subtitle
        </div>

    </div>

</div>

<div class="timeline">

    <button id="play">▶️</button>

    <input
        id="time"
        type="range"
        min="0"
        max="1"
        value="0"
        step="0.01"
    >

    <span id="timeText">0:00</span>

</div>

<div class="toolbar">

    <button class="tool active" data-tool="video">
        🎬<br>Video
    </button>

    <button class="tool" data-tool="mask">
        🔲<br>Mask
    </button>

    <button class="tool" data-tool="text">
        📝<br>Text
    </button>

    <button class="tool" data-tool="audio">
        🔊<br>Audio
    </button>

    <button class="tool" data-tool="music">
        🎵<br>Music
    </button>

    <button class="tool" data-tool="crop">
        ✂️<br>Crop
    </button>

    <button class="tool" data-tool="flip">
        🔄<br>Flip
    </button>

</div>

<div id="panel" class="panel"></div>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const preview = document.getElementById("preview");
const maskBox = document.getElementById("maskBox");
const subtitleBox = document.getElementById("subtitleBox");

const timeSlider = document.getElementById("time");
const timeText = document.getElementById("timeText");
const playButton = document.getElementById("play");
const panel = document.getElementById("panel");

let state = {
    ratio:"Original",

    zoom:1,
    posX:0,
    posY:0,

    flipH:false,
    flipV:false,

    mask:{
        enabled:false,
        type:"blur",
        invert:false,
        x:.05,
        y:.75,
        w:.90,
        h:.18
    },

    subtitle:{
        enabled:false,
        x:.5,
        y:.85,
        w:.85,
        h:.12,
        size:24
    },

    trimStart:0,
    trimEnd:0,

    originalVolume:0,
    voiceVolume:100,
    musicVolume:15
};

let sourceUrl="";
let subtitleText="";

function send(){

    if(window.Streamlit){

        Streamlit.setComponentValue({
            ...state,
            currentTime:video.currentTime
        });

    }

}

function fmt(t){

    t=Math.max(0,t);

    let m=Math.floor(t/60);
    let s=Math.floor(t%60);

    return m+":"+(s<10?"0":"")+s;

}

function resizeCanvas(){

    let w=video.videoWidth || 640;
    let h=video.videoHeight || 360;

    if(state.ratio==="9:16"){
        h=w*16/9;
    }

    if(state.ratio==="16:9"){
        h=w*9/16;
    }

    if(state.ratio==="1:1"){
        h=w;
    }

    if(state.ratio==="4:5"){
        h=w*5/4;
    }

    canvas.width=w;
    canvas.height=h;

    draw();

}

function draw(){

    if(!video.videoWidth) return;

    let w=canvas.width;
    let h=canvas.height;

    ctx.clearRect(0,0,w,h);

    ctx.save();

    let scale=state.zoom;

    let x=w/2+(state.posX/100)*w;
    let y=h/2+(state.posY/100)*h;

    ctx.translate(x,y);

    if(state.flipH) ctx.scale(-1,1);
    if(state.flipV) ctx.scale(1,-1);

    let vw=video.videoWidth*scale;
    let vh=video.videoHeight*scale;

    ctx.drawImage(
        video,
        -vw/2,
        -vh/2,
        vw,
        vh
    );

    ctx.restore();

    updateBoxes();

}

function updateBoxes(){

    let rect=canvas.getBoundingClientRect();

    if(state.mask.enabled){

        maskBox.style.display="block";

        maskBox.style.left=
            (state.mask.x*rect.width)+"px";

        maskBox.style.top=
            (state.mask.y*rect.height)+"px";

        maskBox.style.width=
            (state.mask.w*rect.width)+"px";

        maskBox.style.height=
            (state.mask.h*rect.height)+"px";

    }else{

        maskBox.style.display="none";

    }

    if(state.subtitle.enabled){

        subtitleBox.style.display="block";

        subtitleBox.style.left=
            ((state.subtitle.x-state.subtitle.w/2)
            *rect.width)+"px";

        subtitleBox.style.top=
            ((state.subtitle.y-state.subtitle.h/2)
            *rect.height)+"px";

        subtitleBox.style.width=
            (state.subtitle.w*rect.width)+"px";

        subtitleBox.style.height=
            (state.subtitle.h*rect.height)+"px";

        subtitleBox.innerText=
            subtitleText || "မြန်မာစာတန်း";

        subtitleBox.style.fontSize=
            state.subtitle.size+"px";

    }else{

        subtitleBox.style.display="none";

    }

}

video.addEventListener("loadedmetadata",()=>{

    state.trimEnd=video.duration;

    timeSlider.max=video.duration;

    resizeCanvas();

    send();

});

video.addEventListener("timeupdate",()=>{

    if(!video.seeking){

        timeSlider.value=video.currentTime;

    }

    timeText.innerText=fmt(video.currentTime);

    draw();

});

playButton.onclick=()=>{

    if(video.paused){

        video.play();

        playButton.innerText="⏸️";

    }else{

        video.pause();

        playButton.innerText="▶️";

    }

};

timeSlider.oninput=()=>{

    video.currentTime=
        Number(timeSlider.value);

    draw();

    send();

};

function setupDrag(box,type){

    let action=null;

    let startX=0;
    let startY=0;

    let original=null;

    box.addEventListener("pointerdown",e=>{

        e.preventDefault();

        box.setPointerCapture(e.pointerId);

        let rect=canvas.getBoundingClientRect();

        startX=e.clientX;
        startY=e.clientY;

        if(type==="mask")
            original={...state.mask};
        else
            original={...state.subtitle};

        let target=e.target;

        if(target.classList.contains("handle")){

            let corner="";

            if(target.classList.contains("tl")) corner="tl";
            if(target.classList.contains("tr")) corner="tr";
            if(target.classList.contains("bl")) corner="bl";
            if(target.classList.contains("br")) corner="br";

            action={mode:"resize",corner};

        }else{

            action={mode:"move"};

        }

    });

    box.addEventListener("pointermove",e=>{

        if(!action) return;

        let rect=canvas.getBoundingClientRect();

        let dx=(e.clientX-startX)/rect.width;
        let dy=(e.clientY-startY)/rect.height;

        let obj=
            type==="mask"
            ? state.mask
            : state.subtitle;

        if(action.mode==="move"){

            if(type==="mask"){

                obj.x=Math.max(
                    0,
                    Math.min(
                        1-obj.w,
                        original.x+dx
                    )
                );

                obj.y=Math.max(
                    0,
                    Math.min(
                        1-obj.h,
                        original.y+dy
                    )
                );

            }else{

                obj.x=Math.max(
                    obj.w/2,
                    Math.min(
                        1-obj.w/2,
                        original.x+dx
                    )
                );

                obj.y=Math.max(
                    obj.h/2,
                    Math.min(
                        1-obj.h/2,
                        original.y+dy
                    )
                );

            }

        }else{

            let min=.03;

            let x=original.x;
            let y=original.y;
            let w=original.w;
            let h=original.h;

            if(action.corner.includes("l")){

                let nx=Math.max(
                    0,
                    Math.min(
                        x+w-min,
                        x+dx
                    )
                );

                w-=nx-x;
                x=nx;

            }

            if(action.corner.includes("r")){

                w=Math.max(
                    min,
                    Math.min(
                        1-x,
                        original.w+dx
                    )
                );

            }

            if(action.corner.includes("t")){

                let ny=Math.max(
                    0,
                    Math.min(
                        y+h-min,
                        y+dy
                    )
                );

                h-=ny-y;
                y=ny;

            }

            if(action.corner.includes("b")){

                h=Math.max(
                    min,
                    Math.min(
                        1-y,
                        original.h+dy
                    )
                );

            }

            obj.x=x;
            obj.y=y;
            obj.w=w;
            obj.h=h;

        }

        updateBoxes();
        send();

    });

    box.addEventListener("pointerup",()=>{
        action=null;
    });

}

setupDrag(maskBox,"mask");
setupDrag(subtitleBox,"subtitle");

document.querySelectorAll(".tool")
.forEach(btn=>{

    btn.onclick=()=>{

        document
        .querySelectorAll(".tool")
        .forEach(x=>x.classList.remove("active"));

        btn.classList.add("active");

        showPanel(btn.dataset.tool);

    };

});

function showPanel(tool){

    if(tool==="mask"){

        state.mask.enabled=true;

        panel.innerHTML=`

        <b>🔲 Mask</b>

        <div class="row">
        <label>Type</label>

        <select id="maskType">
            <option value="blur">Blur</option>
            <option value="mosaic">Mosaic</option>
            <option value="solid">Solid</option>
        </select>
        </div>

        <div class="row">
        <label>
        <input id="invert"
        type="checkbox">
        Invert
        </label>
        </div>

        <div class="small">
        Video ပေါ်က အဝါရောင် box ကို
        လက်နဲ့ဆွဲပြီး Chinese subtitle
        နေရာပေါ်တင်ပါ။
        </div>
        `;

        document.getElementById("maskType")
        .value=state.mask.type;

        document.getElementById("maskType")
        .onchange=e=>{

            state.mask.type=e.target.value;
            send();

        };

        document.getElementById("invert")
        .checked=state.mask.invert;

        document.getElementById("invert")
        .onchange=e=>{

            state.mask.invert=e.target.checked;
            send();

        };

        updateBoxes();

    }

    else if(tool==="text"){

        state.subtitle.enabled=true;

        panel.innerHTML=`

        <b>📝 Subtitle</b>

        <div class="row">
        <label>Size</label>

        <input
        id="subSize"
        type="range"
        min="14"
        max="80"
        value="${state.subtitle.size}">
        </div>

        <div class="small">
        အစိမ်းရောင် Subtitle box ကို
        video ပေါ်မှာ လက်နဲ့ဆွဲပြီး
        လိုချင်တဲ့နေရာကိုထားပါ။
        </div>
        `;

        document.getElementById("subSize")
        .oninput=e=>{

            state.subtitle.size=
                Number(e.target.value);

            updateBoxes();
            send();

        };

        updateBoxes();

    }

    else if(tool==="video"){

        panel.innerHTML=`

        <b>🎬 Video</b>

        <div class="row">
        <label>Zoom</label>

        <input
        id="zoom"
        type="range"
        min=".5"
        max="2.5"
        step=".01"
        value="${state.zoom}">
        </div>

        <div class="row">
        <label>X</label>

        <input
        id="px"
        type="range"
        min="-50"
        max="50"
        value="${state.posX}">
        </div>

        <div class="row">
        <label>Y</label>

        <input
        id="py"
        type="range"
        min="-50"
        max="50"
        value="${state.posY}">
        </div>
        `;

        document.getElementById("zoom")
        .oninput=e=>{

            state.zoom=Number(e.target.value);
            draw();
            send();

        };

        document.getElementById("px")
        .oninput=e=>{

            state.posX=Number(e.target.value);
            draw();
            send();

        };

        document.getElementById("py")
        .oninput=e=>{

            state.posY=Number(e.target.value);
            draw();
            send();

        };

    }

    else if(tool==="crop"){

        panel.innerHTML=`

        <b>📐 Ratio</b>

        <div class="row">

        <select id="ratio">

        <option>Original</option>
        <option>9:16</option>
        <option>16:9</option>
        <option>1:1</option>
        <option>4:5</option>

        </select>

        </div>

        `;

        document.getElementById("ratio")
        .value=state.ratio;

        document.getElementById("ratio")
        .onchange=e=>{

            state.ratio=e.target.value;
            resizeCanvas();
            send();

        };

    }

    else if(tool==="flip"){

        state.flipH=!state.flipH;

        draw();
        send();

        showPanel("video");

    }

    else if(tool==="audio"){

        panel.innerHTML=`

        <b>🔊 Audio</b>

        <div class="row">
        <label>Original</label>

        <input
        id="orig"
        type="range"
        min="0"
        max="100"
        value="${state.originalVolume}">
        </div>

        <div class="row">
        <label>Voiceover</label>

        <input
        id="voice"
        type="range"
        min="0"
        max="150"
        value="${state.voiceVolume}">
        </div>

        `;

        document.getElementById("orig")
        .oninput=e=>{

            state.originalVolume=
                Number(e.target.value);

            send();

        };

        document.getElementById("voice")
        .oninput=e=>{

            state.voiceVolume=
                Number(e.target.value);

            send();

        };

    }

    else if(tool==="music"){

        panel.innerHTML=`

        <b>🎵 Background Music</b>

        <div class="row">
        <label>Music Volume</label>

        <input
        id="music"
        type="range"
        min="0"
        max="80"
        value="${state.musicVolume}">
        </div>
        `;

        document.getElementById("music")
        .oninput=e=>{

            state.musicVolume=
                Number(e.target.value);

            send();

        };

    }

}

function receive(event){

    let data=event.detail || {};

    if(data.args){

        let a=data.args;

        if(a.video){

            sourceUrl=a.video;

            video.src=sourceUrl;

            video.load();

        }

        if(a.subtitle){

            subtitleText=a.subtitle;
            updateBoxes();

        }

        if(a.state){

            state={
                ...state,
                ...a.state,
                mask:{
                    ...state.mask,
                    ...(a.state.mask||{})
                },
                subtitle:{
                    ...state.subtitle,
                    ...(a.state.subtitle||{})
                }
            };

        }

    }

}

window.addEventListener(
    "message",
    event=>{

        if(
            event.data &&
            event.data.type==="streamlit:render"
        ){

            receive({
                detail:event.data
            });

        }

    }
);

window.addEventListener(
    "resize",
    ()=>{
        resizeCanvas();
        updateBoxes();
    }
);

if(window.Streamlit){

    Streamlit.setComponentReady();

    Streamlit.setFrameHeight(650);

}

showPanel("video");

</script>

</body>
</html>
